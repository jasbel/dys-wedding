<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <style>
    .gold-text {
      font-family: 'Playfair Display', 'Georgia', 'Great Vibes', 'Edwardian Script ITC', cursive, serif;
      fill: url(#gold-gradient);
      text-anchor: middle;
    }
    .initials {
      font-size: 72px;
      font-style: italic;
    }
    .subtext {
      font-size: 32px;
      font-style: italic;
    }
    .leaf {
      fill: #1A2E22;
    }
  </style>

  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6f27" />
      <stop offset="25%" stop-color="#b89742" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="75%" stop-color="#b89742" />
      <stop offset="100%" stop-color="#8a6f27" />
    </linearGradient>

    <g id="single-leaf">
      <path d="M0,0 Q15,-10 30,-5 Q15,15 0,0" />
    </g>
    <g id="pair-leaves">
      <use href="#single-leaf" transform="rotate(-25)" />
      <use href="#single-leaf" transform="scale(1, -1) rotate(-25)" />
    </g>
  </defs>

  <rect width="100%" height="100%" fill="#FAF9F6" />

  <g transform="translate(250, 250)">
    <path d="M -180,-30 A 190 190 0 0 1 140,-120" fill="none" stroke="#1A2E22" stroke-width="2" />
    
    <use href="#pair-leaves" class="leaf" transform="translate(-180, -30) rotate(20) scale(0.7)" />
    <use href="#pair-leaves" class="leaf" transform="translate(-170, -70) rotate(35) scale(0.75)" />
    <use href="#pair-leaves" class="leaf" transform="translate(-150, -110) rotate(50) scale(0.8)" />
    <use href="#pair-leaves" class="leaf" transform="translate(-120, -145) rotate(65) scale(0.85)" />
    <use href="#pair-leaves" class="leaf" transform="translate(-80, -170) rotate(80) scale(0.85)" />
    <use href="#pair-leaves" class="leaf" transform="translate(-35, -185) rotate(95) scale(0.85)" />
    <use href="#pair-leaves" class="leaf" transform="translate(10, -188) rotate(110) scale(0.8)" />
    <use href="#pair-leaves" class="leaf" transform="translate(55, -180) rotate(125) scale(0.75)" />
    <use href="#pair-leaves" class="leaf" transform="translate(100, -160) rotate(140) scale(0.7)" />
    <use href="#pair-leaves" class="leaf" transform="translate(140, -120) rotate(155) scale(0.6)" />
  </g>

  <g transform="translate(250, 250)">
    <path d="M 180,30 A 190 190 0 0 1 -140,120" fill="none" stroke="#1A2E22" stroke-width="2" />
    
    <use href="#pair-leaves" class="leaf" transform="translate(180, 30) rotate(200) scale(0.7)" />
    <use href="#pair-leaves" class="leaf" transform="translate(170, 70) rotate(215) scale(0.75)" />
    <use href="#pair-leaves" class="leaf" transform="translate(150, 110) rotate(230) scale(0.8)" />
    <use href="#pair-leaves" class="leaf" transform="translate(120, 145) rotate(245) scale(0.85)" />
    <use href="#pair-leaves" class="leaf" transform="translate(80, 170) rotate(260) scale(0.85)" />
    <use href="#pair-leaves" class="leaf" transform="translate(35, 185) rotate(275) scale(0.85)" />
    <use href="#pair-leaves" class="leaf" transform="translate(-10, 188) rotate(290) scale(0.8)" />
    <use href="#pair-leaves" class="leaf" transform="translate(-55, 180) rotate(305) scale(0.75)" />
    <use href="#pair-leaves" class="leaf" transform="translate(-100, 160) rotate(320) scale(0.7)" />
    <use href="#pair-leaves" class="leaf" transform="translate(-140, 120) rotate(335) scale(0.6)" />
  </g>

  <text x="250" y="230" class="gold-text initials">C &amp; M</text>
  
  <text x="250" y="300" class="gold-text subtext">Nos Casamos</text>
</svg>
